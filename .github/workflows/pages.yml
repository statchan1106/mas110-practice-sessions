name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES_BUILD: 'true'
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Verify static export
        run: |
          test -f dist/client/index.html
          test -f dist/client/chapter-2.html
          test -f dist/client/chapter-2/gaussian-elimination.html
          test -f dist/client/chapter-2/block-matrices-graphs.html
          test -f dist/client/chapter-2/lu-decomposition.html
          test -f dist/client/chapter-2/gaussian-detail.html
          test -f dist/client/chapter-3.html
          test -f dist/client/chapter-3/null-space.html
          test -f dist/client/chapter-3/linear-transformations.html
          test -f dist/client/chapter-3/non-invertible-system.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
